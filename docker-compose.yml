services:
  voice-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-assistant
    # Bridge networking with the host-gateway alias: the llama.cpp server on
    # the host is reached via http://host.docker.internal:8080 and must
    # listen on the bridge gateway (e.g. --host 0.0.0.0), not only loopback.
    # ALSA audio devices still work via the devices: passthrough below.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./models:/models
    environment:
      - WHISPER_MODEL=/models/whisper/ggml-small.en-q5_1.bin
      - PIPER_MODEL=/models/piper/en_US-ryan-high.onnx
      # Overridable via host env var or .env file (see .env.example)
      - WHISPER_THREADS=${WHISPER_THREADS:-}
      - WHISPER_VAD_MODEL=${WHISPER_VAD_MODEL:-/models/whisper/ggml-silero-v5.1.2.bin}
      - CAPTURE_MODE=${CAPTURE_MODE:-vad}
      - VAD_THRESHOLD=${VAD_THRESHOLD:-}
      - VAD_STOP_THRESHOLD=${VAD_STOP_THRESHOLD:-}
      - VAD_START_MS=${VAD_START_MS:-}
      - VAD_SILENCE_SEC=${VAD_SILENCE_SEC:-}
      - VAD_MAX_UTTERANCE_SEC=${VAD_MAX_UTTERANCE_SEC:-}
      - VAD_MIN_SPEECH_MS=${VAD_MIN_SPEECH_MS:-}
      - SESSION_TIMEOUT_SEC=${SESSION_TIMEOUT_SEC:-}
      - SESSION_MAX_MESSAGES=${SESSION_MAX_MESSAGES:-}
      - SESSION_RESET_PHRASE=${SESSION_RESET_PHRASE:-}
      - LLM_ENDPOINT=${LLM_ENDPOINT:-http://host.docker.internal:8080}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_SYSTEM_PROMPT=${LLM_SYSTEM_PROMPT:-}
      - LLM_DISABLE_REASONING=${LLM_DISABLE_REASONING:-}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-30s}
      - LLM_STREAM=${LLM_STREAM:-false}
      - DEBUG=false
    devices:
      - /dev/snd:/dev/snd
    cap_drop:
      - ALL
    # Host audio group (gid 29 on Ubuntu) so the non-root container user can
    # open the /dev/snd devices.
    group_add:
      - "${AUDIO_GID:-29}"
    restart: unless-stopped
